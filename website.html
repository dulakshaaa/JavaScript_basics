<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js practice</title>
    <style>
      .my-button {
        background-color: red;
        color: white;
        border: none;
      }
      .btn {
        background-color: rgb(0, 173, 46);
        color: white;
        border: none;
      }
      .happy {
        color: green;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <button class="btn" onclick="alert('HI')">hello</button>
    <p>
      world!!!
      <button title="Click me!" class="my-button">click me</button>
    </p>
    <p class="happy">I am happy!</p>

    <script>
      alert("hello world");
      console.log("hello world");
    </script>
  </body>
</html>
